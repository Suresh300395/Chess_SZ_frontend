<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="%BASE_URL%Circle_Logo_White.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
  <meta name="theme-color" content="#d06c38" />
  <meta name="description" content="South Zone Inter-University Chess (Men) Tournament organized by Aditya University" />
  
  <!-- PWA & Mobile Web App Capabilities -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AUS Chess" />
  <meta name="application-name" content="AUS Chess" />
  <meta name="msapplication-TileColor" content="#d06c38" />
  <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
  <title>AUS | South Zone Chess</title>
</head>

<body style="margin: 0; padding: 0; background-color: #FAF6F3; font-family: 'Montserrat', system-ui, -apple-system, sans-serif;">
  <div id="root">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #FAF6F3; gap: 16px;">
      <div style="width: 44px; height: 44px; border-radius: 50%; border: 3px solid rgba(208, 108, 56, 0.2); border-top-color: #d06c38; animation: chess-spin 0.8s linear infinite;"></div>
      <p style="margin: 0; font-size: 14px; font-weight: 600; color: #0D233B; letter-spacing: 0.5px;">Loading Tournament...</p>
    </div>
  </div>
  <style>
    @keyframes chess-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
